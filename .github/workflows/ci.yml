name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # No bytecode caches inside the tree: they would carry the runner's absolute paths.
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  verify:
    # Verification first: (1) the committed seal must recompute from the files on disk before
    # anything runs; (2) the smoke run regenerates every output with a small N into output/smoke/
    # (never a sealed path), then runs the whole test suite (which asserts every published number
    # against the sealed outputs) and verifies the seal again. The full run (N = 200,000) is
    # byte-identical only in the sealed environment recorded in env.json, because the summaries
    # record the Python/numpy/scipy versions; it is Track 2 of REPRODUCIBILITY.md, not CI.
    name: seal + smoke run + tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the oldest supported version (from 3.12 on the built-in sum() adds floats with
        # compensated summation; on 3.11 two tests fail, see REPRODUCIBILITY.md); 3.14 is the
        # version of the sealed run (env.json).
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # requirements.txt, not "pip install .": the package is a set of scripts, not a library.
        run: python -m pip install -r requirements.txt
      - name: Verify the committed provenance seal
        run: python make_provenance.py --verify
      - name: Smoke run (outputs -> tests -> seal verification)
        run: python run_all.py --smoke

  lint:
    name: ruff + docstring coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters
        # Pinned: the formatter output changes between ruff releases; 0.16.9 is the version that
        # validated the sealed code.
        run: python -m pip install "ruff==0.16.9" "interrogate==1.7.0"
      - run: ruff format --no-cache --check .
      - run: ruff check --no-cache .
      - run: interrogate -f 100 .
